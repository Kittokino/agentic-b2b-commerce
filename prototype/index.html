<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Order, Every Channel</title>
  <meta name="description" content="Prototype: one order from a chef's voice note to a confirmed delivery, seen from Kade's order screen in Sana.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/tokens.css?v=2">
  <link rel="stylesheet" href="../shared/components.css?v=4">
  <link rel="stylesheet" href="prototype.css?v=38">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-agent" viewBox="0 0 24 24"><path d="M11 4l1.9 5.6 5.6 1.9-5.6 1.9L11 19l-1.9-5.6-5.6-1.9 5.6-1.9z"/><path d="M19 3v4M17 5h4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-rule" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-kebab" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-point" viewBox="0 0 24 24"><path d="M11 8.5H4.25a1.5 1.5 0 0 0 0 3H11"/><path d="M11 11.5h-1.5a1.5 1.5 0 0 0 0 3H11"/><path d="M11 14.5h-1a1.5 1.5 0 0 0 0 3h1"/><path d="M11 17.5h3.5c2.8 0 5-2 5-4.8V10.5c0-2.2-1.6-3.6-3.6-3.6H13l-1.2-1.6"/><path d="M11 8.5V7.3a1.5 1.5 0 0 1 .8-2"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M9 6h9v9M18 6L6 18"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
</svg>

<main class="stage">
  <!-- Opening: Nigel sends the voice note after close-down. -->
  <section class="intro" id="intro">
    <img class="opening" src="../assets/places/nigel-closedown.jpg?v=1" alt="Nigel, the head chef, checking his phone in the empty kitchen after service.">
    <div class="intro-text">
      <span class="kicker">Wednesday 28 October, 22:47 · Harbour Front</span>
      <p class="when">After service, Nigel sends Kade a voice note on WhatsApp.</p>
      <blockquote>“Private dinner Saturday, 120 covers. Eighteen kilos of salmon, the usual cheese board, and 24 bottles of Sauvignon Blanc.”</blockquote>
      <h2>Let’s experience how Sana for Kade handles this request.</h2>
      <button class="btn play" data-intro="start"><svg class="ico"><use href="#i-play"/></svg>Play</button>
    </div>
  </section>

  <!-- Left: when, whose screen this is, what led here, and what happens now. -->
  <aside class="rail">
    <div class="rail-body" id="rail-body"></div>
  </aside>

  <!-- Right: one actor's screen at a time; a new actor swipes in. -->
  <section class="screen" id="screen"></section>

  <!-- What an activity link opens. -->
  <div class="modal-layer" id="modal" hidden></div>

  <!-- Controls, across the bottom. -->
  <footer class="footbar">
    <button data-nav="restart" class="btn ghost sm">Start again</button>
    <div class="nav">
      <button data-nav="prev" aria-label="Previous"><svg class="ico"><use href="#i-left"/></svg></button>
      <span class="counter"></span>
      <button data-nav="next" aria-label="Next"><svg class="ico"><use href="#i-right"/></svg></button>
    </div>
    <button class="cue" id="cue" hidden></button>
  </footer>
</main>

<script src="order.js?v=16"></script>
<script src="render.js?v=31"></script>
<script src="app.js?v=30"></script>
</body>
</html>
