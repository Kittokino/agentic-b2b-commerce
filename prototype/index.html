<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Order, Every Channel</title>
  <meta name="description" content="Prototype: one order from a chef's voice note to a confirmed delivery, across WhatsApp, Teams, the service desk and the webshop.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/tokens.css?v=1">
  <link rel="stylesheet" href="../shared/components.css?v=2">
  <link rel="stylesheet" href="prototype.css?v=1">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-agent" viewBox="0 0 24 24"><path d="M11 4l1.9 5.6 5.6 1.9-5.6 1.9L11 19l-1.9-5.6-5.6-1.9 5.6-1.9z"/><path d="M19 3v4M17 5h4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
  <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-teams" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M7 10h4M9 10v5"/><path d="M17 9h3a1 1 0 0 1 1 1v4a3 3 0 0 1-3 3h-1"/><circle cx="18.5" cy="5.5" r="1.8"/></symbol>
  <symbol id="i-desk" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></symbol>
</svg>

<main class="stage">
  <header class="cap">
    <div class="cap-left">
      <span class="cap-time"></span>
      <p class="cap-text"></p>
    </div>
    <div class="cap-right">
      <span class="path"></span>
      <button data-nav="restart" title="Start again">Restart</button>
      <button data-nav="prev" aria-label="Previous step">←</button>
      <span class="counter"></span>
      <button data-nav="next" aria-label="Next step">→</button>
    </div>
  </header>

  <section class="panels">
    <div class="panel" data-panel="whatsapp">
      <div class="who"><span class="face xs"><img src="../assets/personas/nigel.png" alt=""></span><b>Nigel</b><span><svg class="ico"><use href="#i-chat"/></svg>WhatsApp</span></div>
      <div id="whatsapp"></div>
    </div>
    <div class="panel" data-panel="teams">
      <div class="who"><span class="face xs"><img src="../assets/personas/priya.png" alt=""></span><b>Priya</b><span><svg class="ico"><use href="#i-teams"/></svg>Teams</span></div>
      <div id="teams"></div>
    </div>
    <div class="panel" data-panel="right">
      <div class="who tabs">
        <button class="tab" data-tab="desk"><span class="face xs"><img src="../assets/personas/tom.png" alt=""></span>Tom · Service desk</button>
        <button class="tab" data-tab="webshop"><svg class="ico"><use href="#i-screen"/></svg>Webshop</button>
      </div>
      <div id="desk"></div>
      <div id="webshop"></div>
    </div>
  </section>

  <footer class="record" id="record"></footer>
</main>

<script src="order.js?v=1"></script>
<script src="render.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
